<zlux-tab-trap></zlux-tab-trap>
<!-- FA Icon is determined by class name, so we hardcode the style here -->
<div class="padding-1">
  <div class="d-flex">
    <div class="modal-icon-container">
      <i class="{{fileIcon}}"
        style="font-size: 30px; position: absolute; margin-top: 2px; margin-left: 3px; color: #e64242;padding: 1rem;"></i>
    </div>
    <div>
      <h2 mat-dialog-title class="delete-content-body">Are you sure you wish to delete</h2>
    </div>
    <div>
      <button mat-dialog-close class="close-dialog-btn padding-1"><i class="fa fa-close"></i></button>
    </div>
  </div>
  <h2 mat-dialog-title class="delete-content-body">{{getFileName()}}?</h2>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close class="modal-mat-button-delete" (click)="deleteFileOrFolder()">Delete</button>
    <!-- The mat-dialog-close directive optionally accepts a value as a result for the dialog. -->
  </mat-dialog-actions>
</div>
